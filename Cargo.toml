[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/artifact-core",
    "crates/app-host",
    "crates/audit-core",
    "crates/audio-capture",
    "crates/tool-filesystem",
    "crates/tool-http",
    "crates/tool-archive",
    "crates/tool-git",
    "crates/tool-notification",
    "crates/tool-browser",
    "crates/camera-capture",
    "crates/tool-camera",
    "crates/tool-system",
    "crates/tool-audio",
    "crates/tool-media",
    "crates/capability-core",
    "crates/ipc-core",
    "crates/model-core",
    "crates/model-catalog",
    "crates/model-openai-compatible",
    "crates/policy-core",
    "crates/storage-core",
    "crates/tool-core",
    "crates/tool-process",
    "crates/mcp-runtime",
    "crates/secret-core",
    "crates/plugin-core",
    "crates/plugin-wasm",
    "crates/memory",
    "crates/tool-desktop",
    "crates/desktop-linux",
    "crates/desktop-linux-atspi",
    "crates/desktop-linux-wayland",
    "crates/desktop-windows",
    "crates/desktop-macos",
    "crates/tool-sdk",
    "crates/host-core",
    "crates/file-target",
    "crates/tool-filesystem-host",
    "crates/utsuwa-sdk",
    "crates/task-core",
    "crates/task-host",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
async-trait = "0.1"
artifact-core = { path = "crates/artifact-core" }
base64 = "0.22"
ashpd = "0.11.1"
atspi = { version = "0.29", features = ["tokio"] }
pipewire = "0.10.1"
png = "0.18.1"
audit-core = { path = "crates/audit-core" }
audio-capture = { path = "crates/audio-capture" }
desktop-linux = { path = "crates/desktop-linux" }
desktop-linux-atspi = { path = "crates/desktop-linux-atspi" }
desktop-linux-wayland = { path = "crates/desktop-linux-wayland" }
desktop-windows = { path = "crates/desktop-windows" }
desktop-macos = { path = "crates/desktop-macos" }
bytes = "1"
capability-core = { path = "crates/capability-core" }
chrono = { version = "0.4", default-features = true, features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
file-target = { path = "crates/file-target" }
host-core = { path = "crates/host-core" }
iana-time-zone = "0.1"
ipc-core = { path = "crates/ipc-core" }
keyring = { version = "4" }
secret-core = { path = "crates/secret-core" }
model-core = { path = "crates/model-core" }
model-catalog = { path = "crates/model-catalog" }
model-openai-compatible = { path = "crates/model-openai-compatible" }
policy-core = { path = "crates/policy-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rusqlite = { version = "0.32", default-features = false }
toml = "0.8"
wasmtime = { version = "36", default-features = false, features = ["runtime", "cranelift", "wat"] }
serde = { version = "1", features = ["derive"] }
storage-core = { path = "crates/storage-core" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
mcp-runtime = { path = "crates/mcp-runtime" }
memory = { path = "crates/memory" }
plugin-core = { path = "crates/plugin-core" }
plugin-wasm = { path = "crates/plugin-wasm" }
tool-core = { path = "crates/tool-core" }
tool-desktop = { path = "crates/tool-desktop" }
tool-filesystem = { path = "crates/tool-filesystem" }
tool-http = { path = "crates/tool-http" }
tool-archive = { path = "crates/tool-archive" }
tool-git = { path = "crates/tool-git" }
tool-notification = { path = "crates/tool-notification" }
tool-browser = { path = "crates/tool-browser" }
camera-capture = { path = "crates/camera-capture" }
tool-camera = { path = "crates/tool-camera" }
tool-system = { path = "crates/tool-system" }
tool-audio = { path = "crates/tool-audio" }
tool-media = { path = "crates/tool-media" }
tool-filesystem-host = { path = "crates/tool-filesystem-host" }
tool-process = { path = "crates/tool-process" }
tool-sdk = { path = "crates/tool-sdk" }
utsuwa-sdk = { path = "crates/utsuwa-sdk" }
task-core = { path = "crates/task-core" }
task-host = { path = "crates/task-host" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
wat = "1"
