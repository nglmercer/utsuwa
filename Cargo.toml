[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/app-host",
    "crates/audit-core",
    "crates/tool-filesystem",
    "crates/capability-core",
    "crates/ipc-core",
    "crates/model-core",
    "crates/model-openai-compatible",
    "crates/policy-core",
    "crates/storage-core",
    "crates/tool-core",
    "crates/tool-process",
    "crates/mcp-runtime",
    "crates/secret-core",
    "crates/plugin-core",
    "crates/plugin-wasm",
    "crates/memory",
    "crates/tool-desktop",
]
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
async-trait = "0.1"
audit-core = { path = "crates/audit-core" }
bytes = "1"
capability-core = { path = "crates/capability-core" }
futures-core = "0.3"
futures-util = "0.3"
ipc-core = { path = "crates/ipc-core" }
keyring = { version = "4" }
secret-core = { path = "crates/secret-core" }
model-core = { path = "crates/model-core" }
model-openai-compatible = { path = "crates/model-openai-compatible" }
policy-core = { path = "crates/policy-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
rusqlite = { version = "0.32", default-features = false }
toml = "0.8"
wasmtime = { version = "34", default-features = false, features = ["runtime", "cranelift", "wat"] }
serde = { version = "1", features = ["derive"] }
storage-core = { path = "crates/storage-core" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
mcp-runtime = { path = "crates/mcp-runtime" }
memory = { path = "crates/memory" }
plugin-core = { path = "crates/plugin-core" }
plugin-wasm = { path = "crates/plugin-wasm" }
tool-core = { path = "crates/tool-core" }
tool-desktop = { path = "crates/tool-desktop" }
tool-filesystem = { path = "crates/tool-filesystem" }
tool-process = { path = "crates/tool-process" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
wat = "1"
