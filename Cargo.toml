[workspace]
resolver = "2"
members = [
    "crates/app-host",
    "crates/capability-core",
    "crates/ipc-core",
    "crates/policy-core",
]
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
capability-core = { path = "crates/capability-core" }
ipc-core = { path = "crates/ipc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
