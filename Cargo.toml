[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/app-host",
    "crates/audit-core",
    "crates/tool-filesystem",
    "crates/capability-core",
    "crates/ipc-core",
    "crates/model-core",
    "crates/model-openai-compatible",
    "crates/policy-core",
    "crates/storage-core",
    "crates/tool-core",
    "crates/tool-process",
]
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
async-trait = "0.1"
audit-core = { path = "crates/audit-core" }
bytes = "1"
capability-core = { path = "crates/capability-core" }
futures-core = "0.3"
futures-util = "0.3"
ipc-core = { path = "crates/ipc-core" }
model-core = { path = "crates/model-core" }
model-openai-compatible = { path = "crates/model-openai-compatible" }
policy-core = { path = "crates/policy-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", default-features = false }
serde = { version = "1", features = ["derive"] }
storage-core = { path = "crates/storage-core" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tool-core = { path = "crates/tool-core" }
tool-filesystem = { path = "crates/tool-filesystem" }
tool-process = { path = "crates/tool-process" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
