name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # check and test don't resolve CSS side-effect imports or other
      # build-only failures; a route can 500 in production with both green.
      - name: Build
        run: pnpm build

      # The desktop host serves this bundle over companion://app; validate
      # the native adapter output (SPA fallback, CSP hashes) here too.
      - name: Build native bundle
        run: pnpm build:native

      - name: Dependency audit gate
        run: node scripts/audit-gate.mjs

  rust:
    env:
      # The native host serves the frontend in production. Rust-only matrix
      # jobs intentionally skip that bundled build; the web job validates it.
      UTSUWA_SKIP_WEB_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --workspace --locked

      # Native integration tests are conditional: hardware/device paths
      # (camera, microphone, screen capture, accessibility) run through
      # fake backends and compile checks here; real devices need manual
      # validation (see docs/computer-use.md).
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

  # Production desktop path: build the host WITHOUT skipping the bundled
  # frontend so build.rs exercises `pnpm build:native`, then run the host
  # tests (asset server, handshake, protocol) against real artifacts.
  native-bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host with bundled frontend
        run: cargo build -p app-host --locked

      - name: Verify bundled output
        run: |
          test -f build/index.html
          test -f build/theme-init.js
          grep -q 'content-security-policy' build/index.html

      - name: Host tests
        run: cargo test -p app-host --locked
