[package]
name = "app-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "app-host"

[dependencies]
agent-core.workspace = true
artifact-core.workspace = true
audit-core.workspace = true
audio-capture.workspace = true
capability-core.workspace = true
file-target.workspace = true
host-core.workspace = true
ipc-core.workspace = true
model-core.workspace = true
model-catalog.workspace = true
model-openai-compatible.workspace = true
policy-core.workspace = true
secret-core.workspace = true
mcp-runtime.workspace = true
memory.workspace = true
plugin-wasm.workspace = true
tool-desktop.workspace = true
tool-archive.workspace = true
tool-audio.workspace = true
tool-browser.workspace = true
tool-camera.workspace = true
camera-capture.workspace = true
tool-core.workspace = true
tool-git.workspace = true
tool-http.workspace = true
tool-media.workspace = true
tool-notification.workspace = true
tool-system.workspace = true
tool-filesystem.workspace = true
tool-filesystem-host.workspace = true
tool-process.workspace = true
tool-sdk.workspace = true
task-core.workspace = true
task-host.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
storage-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
url.workspace = true
iana-time-zone.workspace = true
winit = "0.30"
wry = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Same WebKitGTK binding wry 0.56.1 builds on (=2.0.2, v2_38): the host uses
# the public `WebViewExtUnix::webview()` handle to register the custom scheme
# as CORS-enabled, which wry 0.56.1 omits and WebKitGTK 2.46+ requires for
# top-level custom-scheme navigation. Pinned exactly like wry's own
# requirement so both crates share one instance.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
desktop-linux.workspace = true
desktop-linux-atspi.workspace = true
desktop-linux-wayland.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
desktop-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
desktop-macos.workspace = true

[dev-dependencies]
wat.workspace = true
