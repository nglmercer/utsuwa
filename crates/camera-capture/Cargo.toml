[package]
name = "camera-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
image = "0.25"
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["decoding", "input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["decoding", "input-msmf"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["decoding", "input-avfoundation"] }

[dev-dependencies]
